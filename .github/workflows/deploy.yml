# Builds the site on every push to main and deploys dist/ to GitHub Pages.
# Repository settings required:
#   - Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   - Settings → Secrets and variables → Actions → secret BLOCKED_TERMS: an extended regex of terms that
#     must never be published (matched case-insensitively). The build fails if it is missing.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write to Pages, and mint the OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels a queued (not yet running) one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # tsc -b (zero TypeScript errors) + vite build. public/404.html is copied into dist/.
      - run: npm run build

      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # Fails the build if any blocked term appears in a text file in dist/ or in the text of a PDF.
      # Prints only file names: never the pattern or the matched text.
      - name: Check for blocked terms
        env:
          BLOCKED_TERMS: ${{ secrets.BLOCKED_TERMS }}
        run: |
          set -euo pipefail
          test -f dist/404.html
          if [ -z "${BLOCKED_TERMS:-}" ]; then
            echo "::error::The BLOCKED_TERMS secret is missing or empty; refusing to deploy without the check."
            exit 1
          fi
          found=0
          # Text files (binary files are skipped by -I); -l lists matching file names only.
          while IFS= read -r file; do
            echo "::error file=$file::Blocked term found in $file"
            found=1
          done < <(grep -rIliE -e "$BLOCKED_TERMS" dist/ || true)
          # PDFs: check their extracted text. Captured first: piping into grep -q under pipefail can turn
          # a match into a failure (grep exits early and pdftotext dies of SIGPIPE).
          while IFS= read -r -d '' pdf; do
            text=$(pdftotext -q "$pdf" - || true)
            if grep -qiE -e "$BLOCKED_TERMS" <<<"$text"; then
              echo "::error file=$pdf::Blocked term found in the text of $pdf"
              found=1
            fi
          done < <(find dist -type f -iname '*.pdf' -print0)
          if [ "$found" -ne 0 ]; then exit 1; fi
          echo "No blocked terms in dist/."

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
