<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%PROFILE_TITLE%</title>
    <meta name="description" content="%PROFILE_DESCRIPTION%" />
    <meta name="color-scheme" content="dark light" />
    <!-- Canonical, theme-color, icons, Open Graph / Twitter, JSON-LD and the font preload are injected
         from src/data/profile.ts by the profile-head plugin in vite.config.ts. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Dark is the default.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
